<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive GitHub Profile HUD Preview</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .preview-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .preview-header h1 {
      font-size: 24px;
      color: #f0f6fc;
      margin-bottom: 8px;
    }
    .preview-header p {
      font-size: 14px;
      color: #8b949e;
    }
    .preview-container {
      width: 100%;
      max-width: 900px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
    }
    .svg-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .svg-wrapper object, .svg-wrapper img {
      width: 100%;
      height: auto;
      display: block;
    }
    .info-strip {
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: monospace;
      font-size: 12px;
      color: #58a6ff;
      border-top: 1px solid #30363d;
      padding-top: 14px;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(47, 129, 247, 0.15);
      border: 1px solid rgba(47, 129, 247, 0.3);
      color: #58a6ff;
    }
  </style>
</head>
<body>
  <div class="preview-header">
    <h1>GitHub Profile Interactive XML / SVG Component</h1>
    <p>Live simulation of Vaultly multi-tenant pipeline, telemetry meters, and interactive navigation</p>
  </div>

  <div class="preview-container">
    <div class="svg-wrapper">
      <object id="profileHud" type="image/svg+xml" data="interactive-card.svg?refresh=20261020" width="100%"></object>
    </div>
    <div class="info-strip">
      <span>Render Mode: Pure XML (SVG 1.1 + SMIL + CSS3)</span>
      <span class="badge">● Live &amp; Responsive</span>
    </div>
  </div>
</body>
</html>
